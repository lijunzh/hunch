name: Deploy Docs

# Builds the mdbook docs/ site and pushes the rendered HTML to the
# gh-pages branch.
#
# GitHub Pages source must be set to:
#   Settings → Pages → Build and deployment → Source: "Deploy from a branch"
#                                          → Branch: gh-pages / (root)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    # Manual trigger for emergency redeploys (e.g., re-render after a
    # mdbook version bump that changes output).

permissions:
  contents: read

# Only one deploy at a time; don't cancel in-progress deploys (we want
# every push to land in gh-pages history).
concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.2"  # Pin to match local dev tooling

jobs:
  build-and-deploy:
    name: Build mdbook + deploy to gh-pages
    runs-on: ubuntu-latest
    # contents: write is needed to push to gh-pages.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Install mdbook
        # taiki-e/install-action provides pre-built binaries (no cargo
        # build), keeping the deploy job under 30s.
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}

      - name: Build book
        run: mdbook build docs

      - name: Deploy to gh-pages
        # Plain git instead of a third-party action: no Node runtime to
        # deprecate, and the whole deploy is visible here. The rendered
        # site replaces the branch contents wholesale (no keep_files: the
        # old /dev/bench/ data was retired with the benchmark workflow).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          rm -rf "$RUNNER_TEMP/gh-pages"
          mkdir "$RUNNER_TEMP/gh-pages"
          cd "$RUNNER_TEMP/gh-pages"
          git init -q
          git remote add origin "$remote"
          if git fetch -q --depth=1 origin gh-pages; then
            git checkout -q -b gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/docs/book/." .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "docs: deploy mdbook from ${SHA}"
          git push -q origin HEAD:gh-pages
